<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BH2XOL</title>
  <meta name="description" content="BH2XOL · 大连 · 辽宁 · 业余无线电">
  <link rel="icon" href="Avatar.png">

  <script>
    (function() {
      var saved = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <style>
    :root {
      --c-bg: #ffffff;
      --c-card-bg: rgba(255, 255, 255, 0.92);
      --c-card-border: rgba(0, 0, 0, 0.07);
      --c-card-shadow: 0 1px 3px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.06);
      --c-text: #1f2328;
      --c-text-heading: #0d1117;
      --c-muted: #656d76;
      --c-accent: #0969da;
      --c-accent-soft: rgba(9, 105, 218, 0.14);
      --c-accent-border: rgba(9, 105, 218, 0.28);
      --c-divider: rgba(0, 0, 0, 0.06);
      --c-avatar-bg: #f6f8fa;
      --c-avatar-border: rgba(0, 0, 0, 0.08);
      --c-glow: rgba(9, 105, 218, 0.03);
      --c-backdrop: none;
      --radius: 12px;
    }

    html[data-theme="dark"] {
      --c-bg: #0d1117;
      --c-card-bg: rgba(22, 27, 34, 0.85);
      --c-card-border: rgba(255, 255, 255, 0.06);
      --c-card-shadow: 0 1px 3px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.2);
      --c-text: #e6edf3;
      --c-text-heading: #f0f6fc;
      --c-muted: #8b949e;
      --c-accent: #58a6ff;
      --c-accent-soft: rgba(88, 166, 255, 0.20);
      --c-accent-border: rgba(88, 166, 255, 0.32);
      --c-divider: rgba(255, 255, 255, 0.06);
      --c-avatar-bg: linear-gradient(135deg, #1a2332, #162030);
      --c-avatar-border: rgba(255, 255, 255, 0.08);
      --c-glow: rgba(88, 166, 255, 0.04);
      --c-backdrop: blur(16px);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
      background: var(--c-bg);
      color: var(--c-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.4s ease, color 0.4s ease;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 35%, var(--c-glow) 0%, transparent 70%);
      pointer-events: none;
      transition: background 0.4s ease;
    }

    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal;
    }

    ::view-transition-new(root) {
      animation: vt-reveal 1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      z-index: 2;
    }

    ::view-transition-old(root) {
      z-index: 1;
    }

    @keyframes vt-reveal {
      from {
        clip-path: circle(0 at var(--vt-x, 50%) var(--vt-y, 50%));
      }
      to {
        clip-path: circle(200% at var(--vt-x, 50%) var(--vt-y, 50%));
      }
    }

    .container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
    }

    .theme-toggle {
      user-select: none;
      -webkit-user-select:none;
      position: absolute;
      top: -3rem;
      right: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--c-card-border);
      background: var(--c-card-bg);
      backdrop-filter: var(--c-backdrop);
      -webkit-backdrop-filter: var(--c-backdrop);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--c-muted);
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.4s ease, border-color 0.4s ease, transform 0.2s ease, color 0.3s ease;
    }

    .theme-toggle:hover {
      transform: scale(1.08);
      color: var(--c-accent);
      border-color: var(--c-accent-border);
    }

    .theme-toggle:focus-visible {
      border-color: var(--c-accent-border);
      box-shadow: 0 0 0 2px var(--c-accent-soft);
    }

    .theme-toggle svg {
      width: 16px;
      height: 16px;
      pointer-events: none;
    }

    html:not([data-theme="dark"]) .icon-sun,
    html[data-theme="dark"] .icon-moon {
      display: none;
    }

    .avatar-row {
      user-select: none;
      -webkit-user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.75rem;
    }

    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 2px solid var(--c-avatar-border);
      overflow: hidden;
      transition: border-color 0.4s ease;
    }

    .avatar img {
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card {
      user-select: none;
      -webkit-user-select: none;
      background: var(--c-card-bg);
      backdrop-filter: var(--c-backdrop);
      -webkit-backdrop-filter: var(--c-backdrop);
      border: 1px solid var(--c-card-border);
      border-radius: var(--radius);
      padding: 2rem 1.75rem 1.75rem;
      box-shadow: var(--c-card-shadow);
      transition: background-color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
    }

    .header {
      user-select: none;
      -webkit-user-select: none;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .callsign {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--c-text-heading);
      transition: color 0.4s ease;
    }

    .sub {
      margin-top: 0.3rem;
      font-size: 0.8rem;
      color: var(--c-muted);
      letter-spacing: 0.04em;
      transition: color 0.4s ease;
    }

    .cq {
      user-select: none;
      -webkit-user-select: none;
      text-align: center;
      font-size: 0.78rem;
      color: var(--c-muted);
      margin-top: 0.5rem;
      margin-bottom: -0.25rem;
      font-style: italic;
      opacity: 0.7;
      letter-spacing: 0.08em;
      transition: color 0.4s ease;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--c-divider);
      margin: 0 0 1.25rem;
      transition: border-color 0.4s ease;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .links a {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem 0.9rem;
      border: 1px solid transparent;
      border-radius: 10px;
      color: var(--c-text);
      text-decoration: none;
      font-size: 0.88rem;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.25s ease, border-color 0.25s ease, color 0.4s ease, transform 0.2s ease;
    }

    .links a:hover {
      background: var(--c-accent-soft);
      border-color: var(--c-accent-border);
      transform: translateX(3px);
    }

    .links a:focus-visible {
      border-color: var(--c-accent-border);
      background: var(--c-accent-soft);
    }

    .icon {
      flex-shrink: 0;
      width: 22px;
      text-align: center;
      font-size: 1.05rem;
      opacity: 0.85;
    }

    .link-body {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .link-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--c-text-heading);
      transition: color 0.4s ease;
    }

    .link-desc {
      font-size: 0.7rem;
      color: var(--c-muted);
      margin-top: 0.08rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.4s ease;
    }

    .external-hint {
      margin-left: auto;
      flex-shrink: 0;
      font-size: 0.7rem;
      color: var(--c-muted);
      opacity: 0;
      transition: opacity 0.2s ease, color 0.4s ease;
    }

    .links a:hover .external-hint {
      opacity: 0.5;
    }

    #email-link .external-hint {
      opacity: 0;
    }

    #email-link:hover .external-hint {
      opacity: 0.5;
    }

    .footer {
      user-select: none;
      -webkit-user-select: none;
      text-align: center;
      margin-top: 1.75rem;
      font-size: 0.7rem;
      color: var(--c-muted);
      letter-spacing: 0.06em;
      opacity: 0.55;
      transition: color 0.4s ease;
    }

    @media (max-width: 480px) {
      body { padding: 1.5rem; }
      .card { padding: 1.5rem 1.25rem 1.25rem; }
      .callsign { font-size: 1.5rem; }
      .links a { padding: 0.7rem 0.8rem; }
      .theme-toggle { top: -2.5rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <button class="theme-toggle" id="theme-btn" aria-label="切换深色/浅色模式">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/>
        <line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>

    <div class="avatar-row">
      <div class="avatar">
        < img src="Avatar.png" alt="BH2XOL">
      </div>
    </div>

    <div class="card">
      <div class="header">
        <div class="callsign">BH2XOL</div>
        <div class="sub">大连 · 辽宁</div>
        <div class="cq">CQ CQ CQ DE BH2XOL K</div>
      </div>

      <hr class="divider">

      <div class="links">
        <a href=" ">
          <span class="icon">📝</span>
          <span class="link-body">
            <span class="link-title">博客</span>
            <span class="link-desc">技术笔记 · 折腾日志</span>
          </span>
          <span class="external-hint">→</span>
        </a >

        <a href="https://log.bh2xol.com/">
          <span class="icon">📋</span>
          <span class="link-body">
            <span class="link-title">日志</span>
            <span class="link-desc">通联记录 · QSO 查询</span>
          </span>
          <span class="external-hint">→</span>
        </a >

        <a href="#" id="email-link">
          <span class="icon">📬</span>
          <span class="link-body">
            <span class="link-title">邮箱</span>
            <span class="link-desc">bh2xol@bh2xol.com</span>
          </span>
          <span class="external-hint">复制</span>
        </a >

        <a href="https://github.com/BH2XOL">
          <span class="icon">💻</span>
          <span class="link-body">
            <span class="link-title">GitHub</span>
            <span class="link-desc">开源项目 · 代码片段</span>
          </span>
          <span class="external-hint">→</span>
        </a >

        <a href="https://www.qrz.com/db/BH2XOL">
          <span class="icon">📡</span>
          <span class="link-body">
            <span class="link-title">QRZ</span>
            <span class="link-desc">呼号查询 · QSL · 通联记录</span>
          </span>
          <span class="external-hint">→</span>
        </a >
      </div>
    </div>

    <div class="footer">
      73 de BH2XOL
    </div>
  </div>

  <script>
    (function() {
      var html = document.documentElement;
      var btn = document.getElementById('theme-btn');
      if (!btn) return;

      function setTheme(isDark) {
        if (isDark) {
          html.setAttribute('data-theme', 'dark');
          localStorage.setItem('theme', 'dark');
        } else {
          html.removeAttribute('data-theme');
          localStorage.setItem('theme', 'light');
        }
      }

      function toggleTheme() {
        setTheme(html.getAttribute('data-theme') !== 'dark');
      }

      btn.addEventListener('click', function(e) {
        var rect = btn.getBoundingClientRect();
        var cx = rect.left + rect.width / 2;
        var cy = rect.top + rect.height / 2;

        html.style.setProperty('--vt-x', cx + 'px');
        html.style.setProperty('--vt-y', cy + 'px');

        if (document.startViewTransition) {
          document.startViewTransition(function() {
            toggleTheme();
          });
        } else {
          toggleTheme();
        }
      });

      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
        if (!localStorage.getItem('theme')) {
          if (e.matches) {
            html.setAttribute('data-theme', 'dark');
          } else {
            html.removeAttribute('data-theme');
          }
        }
      });

      var emailLink = document.getElementById('email-link');
      if (emailLink) {
        emailLink.addEventListener('click', function(e) {
          e.preventDefault();
          navigator.clipboard.writeText('bh2xol@bh2xol.com').then(function() {
            var hint = emailLink.querySelector('.external-hint');
            hint.textContent = '已复制';
            hint.style.opacity = '1';
            setTimeout(function() {
              hint.textContent = '复制';
              hint.style.opacity = '0';
            }, 1500);
          })["catch"](function() {
            var hint = emailLink.querySelector('.external-hint');
            hint.textContent = '失败';
            hint.style.opacity = '1';
            setTimeout(function() {
              hint.textContent = '复制';
              hint.style.opacity = '0';
            }, 1500);
          });
        });
      }
    })();
  </script>
</body>
</html>
